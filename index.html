<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0}</style>
<title>Cours Particuliers avec Jérémy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Concept : un écran = une seule tâche. Gros boutons, une couleur par verbe (comme les cartes PDF), aucun chrono. */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --fg: #1b2333; --muted: #56627a; --line: #d6dcea;
  --ink: #1e293b; --on-ink: #ffffff; --star: #eab308;
  --ok: #15803d; --ok-t: #e3f5ea; --ko: #b42318; --ko-t: #fdeceb;
  --dec: #1d4ed8; --exp: #15803d; --comp: #c2410c; --just: #6d28d9; --ded: #be185d; --conc: #eab308;
  --dec-t: #eaf1ff; --exp-t: #e8f7ee; --comp-t: #fff0e6; --just-t: #f0ebff; --ded-t: #fde9f3; --conc-t: #fdf5cc;
  --on-conc: #1f2937;
  --pre: #15803d; --rac: #1d4ed8; --suf: #c2410c;
  --font: "Lexend", Verdana, "DejaVu Sans", Arial, sans-serif;
  --fs: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1420; --surface: #182030; --fg: #eef1f8; --muted: #a3aec6; --line: #2b364d;
    --ink: #e6ebf7; --on-ink: #0f1420;
    --ok: #4ade80; --ok-t: #12301f; --ko: #f87171; --ko-t: #3b1717;
    --dec-t: #16254d; --exp-t: #12301f; --comp-t: #3a1e10; --just-t: #261a4d; --ded-t: #3d1630; --conc-t: #3a3210;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1420; --surface: #182030; --fg: #eef1f8; --muted: #a3aec6; --line: #2b364d;
  --ink: #e6ebf7; --on-ink: #0f1420;
  --ok: #4ade80; --ok-t: #12301f; --ko: #f87171; --ko-t: #3b1717;
  --dec-t: #16254d; --exp-t: #12301f; --comp-t: #3a1e10; --just-t: #261a4d; --ded-t: #3d1630; --conc-t: #3a3210;
  color-scheme: dark;
}
html { font-size: calc(17px * var(--fs)); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 1rem; line-height: 1.6;
  padding-block: 12px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { text-align: left; line-height: 1.2; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: .95rem; background: none; border: 0; padding: 4px 0; }
.dots { display: flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.tools { display: flex; gap: 8px; }
.tool { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; min-height: 2.6rem; padding: 0 14px; font-size: .85rem; font-weight: 500; }
h1 { font-size: 2.3rem; line-height: 1.15; margin: 8px 0 0; font-weight: 700; text-wrap: balance; }
h2 { font-size: 1.35rem; line-height: 1.3; margin: 0; font-weight: 600; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.mode { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; width: 100%;
  background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px 18px; min-width: 0; }
.mode:hover { border-color: var(--fg); }
.mode b { display: block; font-size: 1.15rem; font-weight: 600; }
.mode span { color: var(--muted); font-size: .9rem; display: block; }
.stars { display: flex; gap: 2px; flex: none; }
.stars svg { width: 22px; height: 22px; }
.stars .on { fill: var(--star); stroke: var(--star); }
.stars .off { fill: none; stroke: var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--ink); color: var(--on-ink);
  border: 0; border-radius: 16px; min-height: 3.4rem; padding: 0 22px; font-weight: 600; font-size: 1.05rem; }
.btn.ghost { background: var(--surface); color: var(--fg); border: 2px solid var(--line); }
.btn.full { width: 100%; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 11rem; }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .9rem; }
.prog { display: flex; gap: 6px; }
.prog i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); display: block; }
.prog i.cur { border-color: var(--fg); }
.prog i.ok { background: var(--ok); border-color: var(--ok); }
.prog i.ko { background: var(--ko); border-color: var(--ko); }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.quote { font-size: 1.15rem; line-height: 1.7; margin: 0; }
.label { font-size: .85rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
.listen { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; background: none; border: 1.5px solid var(--line); border-radius: 12px; min-height: 2.6rem; padding: 0 14px; font-size: .9rem; font-weight: 500; }
.listen svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.verbs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.verb { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; text-align: left;
  min-height: 4.4rem; padding: 10px 14px; border: 3px solid transparent; border-radius: 16px; color: #fff; min-width: 0; }
.verb b { font-size: 1.1rem; font-weight: 700; line-height: 1.25; }
.verb small { font-size: .75rem; opacity: .95; line-height: 1.3; }
.dec { background: var(--dec); } .exp { background: var(--exp); } .comp { background: var(--comp); }
.just { background: var(--just); } .ded { background: var(--ded); } .conc { background: var(--conc); color: var(--on-conc); }
.verb.dim { opacity: .35; }
.verb.right, .opt.right { border-color: var(--fg); box-shadow: 0 0 0 3px var(--ok); }
.verb.wrong, .opt.wrong { border-color: var(--ko); box-shadow: 0 0 0 3px var(--ko); }
.chip { display: inline-block; padding: 1px 12px; border-radius: 999px; font-weight: 700; color: #fff; white-space: nowrap; }
.chip.conc { color: var(--on-conc); }
.doc { background: var(--bg); border-radius: 12px; padding: 12px 14px; margin: 0; }
.task { margin: 0; font-size: 1.15rem; line-height: 1.9; }
.opt { text-align: left; width: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; line-height: 1.55; min-width: 0; }
.opt:hover:not(:disabled) { border-color: var(--fg); }
.opt:disabled { cursor: default; }
.opt .tag { display: inline-block; margin-top: 8px; padding: 1px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; color: #fff; }
.opt .tag.conc { color: var(--on-conc); }
.fb { border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 2px solid var(--ok); background: var(--ok-t); }
.fb.no { border-color: var(--ko); background: var(--ko-t); }
.fb b { font-size: 1.05rem; }
.fb p { margin: 0; }
.build { min-height: 5.2rem; border: 2.5px dashed var(--line); border-radius: 16px; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.build.full { border-style: solid; }
.piece { border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 500; line-height: 1.4; text-align: left; color: #fff; min-width: 0; }
.piece.conc { color: var(--on-conc); }
.pool { display: flex; flex-wrap: wrap; gap: 10px; }
.pool button { background: var(--surface); border: 2px solid var(--fg); border-radius: 12px; padding: 10px 14px; line-height: 1.4; text-align: left; font-weight: 500; min-width: 0; }
.pool button:disabled { visibility: hidden; }
.msg { min-height: 1.6rem; margin: 0; color: var(--muted); font-size: .95rem; }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; outline: 3px solid var(--ko); } }
.big-stars { display: flex; gap: 6px; justify-content: center; }
.big-stars svg { width: 54px; height: 54px; }
.center { text-align: center; }
.missed { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.missed li { border-radius: 14px; padding: 12px 14px; background: var(--bg); display: flex; flex-direction: column; gap: 6px; }
.rc { border-radius: 18px; overflow: hidden; border: 2.5px solid var(--line); background: var(--surface); }
.rc h3 { margin: 0; padding: 10px 16px; font-size: 1.2rem; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; color: #fff; }
.rc h3.conc { color: var(--on-conc); }
.rc h3 small { font-weight: 400; font-size: .85rem; }
.rc div { padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.rc p { margin: 0; }
.rc .ex { background: var(--bg); border-radius: 10px; padding: 8px 12px; }
@media (max-width: 420px) { .dots { display: none; } h1 { font-size: 2rem; } .verbs { gap: 8px; } .verb small { display: none; } .verb { min-height: 3.6rem; } }

.scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: .8rem; }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); padding: 6px 5px; border-bottom: 2px solid var(--line); white-space: nowrap; }
.tbl td { padding: 8px 5px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl small { color: var(--muted); margin-left: 4px; }
.bar { display: inline-block; vertical-align: middle; width: 40px; height: 8px; background: var(--line); border-radius: 4px; }
.bar i { display: block; height: 100%; background: var(--fg); border-radius: 4px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpi { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.kpi b { display: block; font-size: 1.6rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .78rem; color: var(--muted); }
.days { display: flex; gap: 4px; align-items: flex-end; height: 100px; }
.days div { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; font-size: .62rem; line-height: 1.2; color: var(--muted); text-align: center; }
.days i { width: 100%; background: var(--fg); border-radius: 4px 4px 0 0; display: block; }
.days div.zero i { background: var(--line); }
.bilan { width: 100%; font: inherit; font-size: .85rem; background: var(--bg); color: var(--fg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; resize: vertical; }

.pc { display: inline-block; padding: 2px 12px; border-radius: 10px; font-weight: 700; color: #fff; line-height: 1.5; }
.pc.pre { background: var(--pre); } .pc.rac { background: var(--rac); } .pc.suf { background: var(--suf); }
.pc.plain { background: var(--line); color: var(--fg); }
.pc.big { font-size: 1.15rem; padding: 8px 14px; border-radius: 12px; }
.wordline { display: inline-flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.bigword { font-size: 2rem; font-weight: 700; margin: 0; line-height: 1.4; word-break: break-word; }
.parts { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.parts > div { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rc h3.pre { background: var(--pre); } .rc h3.rac { background: var(--rac); } .rc h3.suf { background: var(--suf); }
[hidden] { display: none !important; }
.inp { width: 100%; font: inherit; font-size: 1rem; background: var(--bg); color: var(--fg); border: 2px solid var(--line); border-radius: 12px; padding: 12px; min-height: 48px; }
.foot { text-align: center; color: var(--muted); font-size: .85rem; margin: 8px 0 0; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; cursor: pointer; padding: 10px 6px; min-height: 44px; }
.chk { display: flex; gap: 10px; align-items: center; min-height: 44px; }
.chk input { width: 22px; height: 22px; flex: none; }
details.stu { border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
details.stu summary { cursor: pointer; font-weight: 600; min-height: 32px; }
</style>

<div class="wrap">
  <div class="top">
    <button class="brand" data-act="home" aria-label="Retour au menu">
      <span class="dots" aria-hidden="true"><i class="dec"></i><i class="exp"></i><i class="comp"></i><i class="just"></i><i class="ded"></i><i class="conc"></i></span>
      Cours Particuliers avec Jérémy
    </button>
    <div class="tools">
      <button class="tool" data-act="size" aria-label="Changer la taille du texte">A+</button>
      <button class="tool" id="helpbtn" data-act="cards">Cartes</button>
    </div>
  </div>
  <main id="app" class="stack" aria-live="polite"></main>
</div>

<script>
"use strict";
var V = {
  decrire:   { n: "Décrire",   c: "dec",  h: "je dis ce que je vois" },
  expliquer: { n: "Expliquer", c: "exp",  h: "je dis comment et pourquoi" },
  comparer:  { n: "Comparer",  c: "comp", h: "je mets côte à côte" },
  justifier: { n: "Justifier", c: "just", h: "je donne la preuve" },
  deduire:   { n: "Déduire",   c: "ded",  h: "je tire la conséquence" },
  conclure:  { n: "Conclure",  c: "conc", h: "je donne la réponse finale" }
};
var ORDER = ["decrire", "expliquer", "comparer", "justifier", "deduire", "conclure"];

/* Mode 1 : quel verbe ? */
var A = [
  /* décrire */
  { t: "Sur la photo, la bronche du fumeur a peu de cils et beaucoup de mucus.", v: "decrire", clue: "On dit seulement ce qu’on voit. Il n’y a pas de « parce que »." },
  { t: "Le schéma montre un neurone : un corps cellulaire, des ramifications courtes et une longue fibre.", v: "decrire", clue: "On décrit la forme, sans rien expliquer." },
  { t: "Sur la coupe de muscle, on observe des fibres allongées, rangées côte à côte, avec des stries claires et sombres.", v: "decrire", clue: "« On observe » : on dit ce qu’on voit, rien de plus." },
  { t: "Le schéma montre le cœur avec quatre cavités : deux oreillettes en haut et deux ventricules en bas.", v: "decrire", clue: "On nomme et on situe ce qu’on voit, sans expliquer." },
  { t: "Sur le graphique, la fréquence cardiaque passe de 70 à 150 battements par minute pendant l’effort.", v: "decrire", clue: "On lit les valeurs du graphique. On n’explique pas pourquoi." },
  { t: "La radiographie montre l’os de l’avant-bras séparé en deux morceaux.", v: "decrire", clue: "On dit ce qu’on voit sur l’image." },
  { t: "Sur la coupe d’intestin, on observe des replis et de nombreuses petites projections en forme de doigts.", v: "decrire", clue: "« On observe » : une description précise, sans « donc »." },
  { t: "Sur le schéma, le nerf est formé de plusieurs faisceaux de fibres entourés d’une gaine.", v: "decrire", clue: "On décrit l’organisation du nerf, sans expliquer son rôle." },
  { t: "L’alvéole est entourée de nombreux petits vaisseaux sanguins très fins.", v: "decrire", clue: "On dit ce qu’on voit autour de l’alvéole." },
  { t: "Le tableau indique que Paul pèse 82 kg et mesure 1,70 m.", v: "decrire", clue: "On lit les données du document, sans les interpréter." },
  /* expliquer */
  { t: "Quand on touche une plaque chaude, le récepteur de la peau envoie un message à la moelle épinière, qui commande le muscle. Donc la main se retire.", v: "expliquer", clue: "Des étapes reliées par « donc » : on fait comprendre comment ça marche." },
  { t: "Le dioxygène passe de l’alvéole vers le sang parce que la paroi est très fine. Ensuite, le sang le transporte vers les muscles.", v: "expliquer", clue: "« Parce que » et « ensuite » : on raconte le mécanisme." },
  { t: "L’influx nerveux arrive à la jonction neuromusculaire, ce qui libère un neurotransmetteur. Celui-ci déclenche ensuite la contraction de la fibre musculaire.", v: "expliquer", clue: "Des étapes qui s’enchaînent : on explique comment le muscle se contracte." },
  { t: "Les nutriments passent dans le sang car la paroi de l’intestin grêle est très fine et très étendue. Les replis et les villosités augmentent la surface d’échange.", v: "expliquer", clue: "« Car » : on dit pourquoi et comment les nutriments passent dans le sang." },
  { t: "Au niveau de l’alvéole, le dioxygène passe vers le sang car il est plus concentré dans l’air alvéolaire. Donc le sang s’enrichit en dioxygène.", v: "expliquer", clue: "« Car » puis « donc » : on explique le sens de l’échange." },
  { t: "Quand le cœur se contracte, le sang est éjecté dans les artères. Ensuite le cœur se relâche et se remplit de sang à nouveau.", v: "expliquer", clue: "« Ensuite » : on décrit les étapes d’un fonctionnement." },
  { t: "Pendant l’inspiration, le diaphragme se contracte et s’abaisse, donc le volume du thorax augmente et l’air entre dans les poumons.", v: "expliquer", clue: "« Donc » : on enchaîne les causes et les conséquences." },
  { t: "Les enzymes digestives découpent les grosses molécules en petites molécules. Ainsi, ces petites molécules peuvent ensuite être absorbées.", v: "expliquer", clue: "On raconte les étapes de la digestion pour faire comprendre." },
  { t: "Une personne prend du poids quand ses apports énergétiques dépassent durablement ses dépenses. L’excès est donc stocké sous forme de graisse.", v: "expliquer", clue: "« Donc » : on explique le mécanisme de la prise de poids." },
  { t: "L’influx nerveux circule le long du neurone sous forme de signal électrique. À la synapse, il est transmis au neurone suivant par un messager chimique.", v: "expliquer", clue: "On suit le trajet du message pas à pas." },
  /* comparer */
  { t: "Le nerf sensitif amène le message vers la moelle épinière, alors que le nerf moteur l’emmène vers le muscle.", v: "comparer", clue: "« Alors que » : on met deux choses côte à côte." },
  { t: "Comme la bronche, la trachée est un conduit qui amène l’air, mais la trachée est plus large.", v: "comparer", clue: "« Comme » et « mais » : points communs et différences." },
  { t: "Les artères ont une paroi épaisse et élastique, alors que les veines ont une paroi plus fine.", v: "comparer", clue: "« Alors que » : on oppose deux structures." },
  { t: "L’air inspiré contient environ 21 % de dioxygène, alors que l’air expiré en contient environ 16 %.", v: "comparer", clue: "On met en parallèle l’air inspiré et l’air expiré." },
  { t: "Comme les glucides, les lipides apportent de l’énergie, mais les lipides en apportent plus par gramme.", v: "comparer", clue: "« Comme » (point commun) et « mais » (différence)." },
  { t: "Le muscle squelettique se contracte quand on le décide, alors que le muscle du cœur se contracte sans que la volonté intervienne.", v: "comparer", clue: "« Alors que » : deux muscles, deux fonctionnements." },
  { t: "Le système nerveux central comprend l’encéphale et la moelle épinière, tandis que le système nerveux périphérique est formé des nerfs.", v: "comparer", clue: "« Tandis que » : on met les deux systèmes en parallèle." },
  { t: "La radiographie est rapide et peu coûteuse, mais le scanner donne des images plus détaillées.", v: "comparer", clue: "« Mais » : on met deux examens en parallèle." },
  { t: "L’oreillette droite reçoit du sang pauvre en dioxygène, alors que l’oreillette gauche reçoit du sang riche en dioxygène.", v: "comparer", clue: "« Alors que » : deux côtés du cœur côte à côte." },
  { t: "La trachée est tapissée d’un épithélium cilié, alors que la paroi de l’alvéole est très mince et sans cils.", v: "comparer", clue: "« Alors que » : on compare deux parois." },
  /* justifier */
  { t: "Le fumeur attrape plus d’infections. En effet, ses cils détruits n’évacuent plus les microbes.", v: "justifier", clue: "« En effet » : on prouve une phrase déjà donnée." },
  { t: "Le réflexe est rapide. La preuve : le message passe par la moelle épinière, sans attendre le cerveau.", v: "justifier", clue: "« La preuve » : on défend une affirmation avec un argument." },
  { t: "Le muscle est un tissu excitable. En effet, il se contracte quand il reçoit un influx nerveux.", v: "justifier", clue: "« En effet » : on donne la preuve d’une affirmation." },
  { t: "L’intestin grêle est adapté à l’absorption. En effet, sa paroi forme des replis et des villosités qui augmentent la surface d’échange.", v: "justifier", clue: "On prouve que l’intestin est adapté à son rôle." },
  { t: "Le cœur est une pompe musculaire. La preuve : sa paroi est épaisse et se contracte pour envoyer le sang dans les artères.", v: "justifier", clue: "« La preuve » : un argument pour défendre une idée." },
  { t: "Le tabac est un facteur de risque de maladies respiratoires. En effet, la fumée détruit les cils et irrite les bronches.", v: "justifier", clue: "« En effet » : on appuie l’affirmation par un fait." },

document.addEventListener("click", function (e) {

  if (a === "tdash") { stopUsage(); S.view = "teacher"; render(); return; }

    if (o.n) store.name = String(o.n).slice(0, 30);

/* ================= TERMINOLOGIE MÉDICALE ================= */
/* t : pre (préfixe), rac (racine), suf (suffixe).  m : sens court.  n : nom du sens (suffixes) ; d : complément (racines). */
var PARTS = [
  { s: "ite", t: "suf", m: "inflammation", n: "inflammation" },
  { s: "algie", t: "suf", m: "douleur", n: "douleur" },
  { s: "pathie", t: "suf", m: "maladie", n: "maladie" },
  { s: "ectomie", t: "suf", m: "ablation (on enlève)", n: "ablation" },
  { s: "émie", t: "suf", m: "dans le sang" },
  { s: "mégalie", t: "suf", m: "augmentation de volume", n: "augmentation de volume" },
  { s: "plégie", t: "suf", m: "paralysie" },
  { s: "rragie", t: "suf", m: "saignement", n: "saignement" },

  { s: "bronch", t: "rac", m: "bronches", d: "des bronches" },
  { s: "pneumo", t: "rac", m: "poumons", d: "des poumons" },
  { s: "rhin", t: "rac", m: "nez", d: "du nez" },
  { s: "rhino", t: "rac", m: "nez", d: "du nez" },
  { s: "traché", t: "rac", m: "trachée", d: "de la trachée" },
  { s: "my", t: "rac", m: "muscle", d: "du muscle" },
  { s: "myo", t: "rac", m: "muscle", d: "du muscle" },
  { s: "arthr", t: "rac", m: "articulation", d: "d’une articulation" },
  { s: "osté", t: "rac", m: "os", d: "de l’os" },
  { s: "neuro", t: "rac", m: "nerf", d: "des nerfs" },
  { s: "cardio", t: "rac", m: "cœur", d: "du cœur" },
  { s: "gastr", t: "rac", m: "estomac", d: "de l’estomac" },
  { s: "hépat", t: "rac", m: "foie", d: "du foie" },
  { s: "hépato", t: "rac", m: "foie", d: "du foie" },
  { s: "encéphal", t: "rac", m: "encéphale (cerveau)", d: "de l’encéphale" },
  { s: "méning", t: "rac", m: "méninges", d: "des méninges" },
  { s: "appendic", t: "rac", m: "appendice", d: "de l’appendice" },
  { s: "glyc", t: "rac", m: "glucose (sucre)" },
  { s: "cardie", t: "rac", m: "cœur" },
  { s: "pnée", t: "rac", m: "respiration" },
  { s: "orexie", t: "rac", m: "appétit" },
  { s: "phagie", t: "rac", m: "fait de manger" },

  { s: "hyper", t: "pre", m: "trop" },
  { s: "hypo", t: "pre", m: "pas assez" },
  { s: "poly", t: "pre", m: "beaucoup" },
  { s: "brady", t: "pre", m: "lent" },
  { s: "tachy", t: "pre", m: "rapide" },
  { s: "dys", t: "pre", m: "difficulté" },
  { s: "an", t: "pre", m: "absence" },
  { s: "hémi", t: "pre", m: "moitié" }
];
var PM = {}; PARTS.forEach(function (p) { PM[p.s] = p; });
var TYPE = { suf: "suffixe", rac: "racine", pre: "préfixe" };

/* Mots : p = morceaux dans l’ordre ; m / d = sens et faux sens écrits à la main (sinon calculés) */
var WORDS = [
  { w: "bronchite", p: ["bronch", "ite"] }, { w: "gastralgie", p: ["gastr", "algie"] }, { w: "hépatite", p: ["hépat", "ite"] },
  { w: "myalgie", p: ["my", "algie"] }, { w: "myopathie", p: ["myo", "pathie"] }, { w: "arthrite", p: ["arthr", "ite"] },
  { w: "ostéalgie", p: ["osté", "algie"] }, { w: "neuropathie", p: ["neuro", "pathie"] }, { w: "cardiopathie", p: ["cardio", "pathie"] },
  { w: "cardiomégalie", p: ["cardio", "mégalie"] }, { w: "hépatomégalie", p: ["hépato", "mégalie"] }, { w: "pneumopathie", p: ["pneumo", "pathie"] },
  { w: "rhinite", p: ["rhin", "ite"] }, { w: "trachéite", p: ["traché", "ite"] }, { w: "rhinorragie", p: ["rhino", "rragie"] },
  { w: "encéphalite", p: ["encéphal", "ite"] }, { w: "méningite", p: ["méning", "ite"] }, { w: "appendicectomie", p: ["appendic", "ectomie"] },
  { w: "hyperglycémie", p: ["hyper", "glyc", "émie"], m: "trop de glucose dans le sang", d: ["pas assez de glucose dans le sang", "trop de graisse dans le sang"] },
  { w: "hypoglycémie", p: ["hypo", "glyc", "émie"], m: "pas assez de glucose dans le sang", d: ["trop de glucose dans le sang", "pas assez de sang dans le corps"] },
  { w: "tachycardie", p: ["tachy", "cardie"], m: "battements du cœur trop rapides", d: ["battements du cœur trop lents", "douleur du cœur"] },
  { w: "bradycardie", p: ["brady", "cardie"], m: "battements du cœur trop lents", d: ["battements du cœur trop rapides", "maladie du cœur"] },
  { w: "dyspnée", p: ["dys", "pnée"], m: "difficulté à respirer", d: ["absence de respiration", "respiration trop rapide"] },
  { w: "anorexie", p: ["an", "orexie"], m: "absence d’appétit", d: ["manger beaucoup", "douleur de l’estomac"] },
  { w: "polyphagie", p: ["poly", "phagie"], m: "manger beaucoup", d: ["absence d’appétit", "douleur en mangeant"] },
  { w: "hémiplégie", p: ["hémi", "plégie"], m: "paralysie d’une moitié du corps", d: ["paralysie de tout le corps", "douleur d’une moitié du corps"] }
];
var SUF_N = ["ite", "algie", "pathie", "mégalie", "rragie", "ectomie"];
function wordMeaning(w) { return w.m || (PM[w.p[1]].n + " " + PM[w.p[0]].d); }
function wordFakes(w) {
  if (w.d) return w.d;
  var suf = w.p[1], rac = w.p[0], out = [];
  var otherSuf = shuffle(SUF_N.filter(function (s) { return s !== suf; }))[0];
  out.push(PM[otherSuf].n + " " + PM[rac].d);
  var racs = WORDS.filter(function (x) { return !x.m && x.p[0] !== rac && PM[x.p[0]].d !== PM[rac].d; }).map(function (x) { return x.p[0]; });
  out.push(PM[suf].n + " " + PM[shuffle(racs)[0]].d);
  return out;
}
function splitHtml(w) {
  var h = '<div class="parts">';
  w.p.forEach(function (s) { h += '<div><span class="pc ' + PM[s].t + '">' + esc(s) + "</span> <span>" + TYPE[PM[s].t] + " : <b>" + esc(PM[s].m) + "</b></span></div>"; });
  return h + "</div>";
}
function wordChips(w) { var h = '<span class="wordline">'; w.p.forEach(function (s) { h += '<span class="pc ' + PM[s].t + '">' + esc(s) + "</span>"; }); return h + "</span>"; }

/* Fiche vocabulaire (vue « Vocabulaire ») */
function viewVocab() {
  var h = "<h2>Le vocabulaire</h2><p class=\"lead\">Un mot médical se découpe : préfixe, racine, suffixe. Je lis la fin, puis le début.</p>";
  [["suf", "Les suffixes : ce qui se passe"], ["rac", "Les racines : où ça se passe"], ["pre", "Les préfixes : le plus ou le moins"]].forEach(function (g) {
    var groups = [], seen = {};
    PARTS.filter(function (p) { return p.t === g[0]; }).forEach(function (p) { if (seen[p.m] == null) { seen[p.m] = groups.length; groups.push({ m: p.m, f: [] }); } groups[seen[p.m]].f.push(p.s); });
    h += '<div class="rc" style="border-color:var(--' + g[0] + ')"><h3 class="' + g[0] + '"><span>' + g[1] + "</span></h3><div>";
    groups.forEach(function (x) { h += "<p><b>" + esc(x.f.join(" / ")) + "</b> : " + esc(x.m) + "</p>"; });
    h += "</div></div>";
  });
  return h + '<button class="btn full" data-act="back">Retour</button>';
}

/* Jeu 4 : que veut dire ce mot ? */
registerGame({
  id: "sens-du-mot", name: "Que veut dire ce mot ?", desc: "Je lis un mot médical et je trouve son sens.", n: 5, pool: WORDS, help: "vocab",
  prep: function (items) { return items.map(function (w) { var m = wordMeaning(w), o = [{ t: m, ok: true }]; wordFakes(w).forEach(function (f) { o.push({ t: f, ok: false }); }); return { w: w, o: shuffle(o) }; }); },
  reset: function () { return { done: false, picked: null }; },
  view: function (it, q, E) {
    var h = E.head(), speak = "Que veut dire " + it.w.w + " ?";
    it.o.forEach(function (o, i) { speak += " Réponse " + (i + 1) + " : " + o.t; });
    h += '<div class="panel center"><p class="label">Que veut dire ce mot ?</p><p class="bigword">' + (q.done ? wordChips(it.w) : E.esc(it.w.w)) + "</p>" + E.listen(speak) + "</div><div class=\"stack\">";

    });
    h += "</div>";
    if (q.done) { var ok = it.o[q.picked].ok; h += '<div class="fb' + (ok ? "" : " no") + '"><b>' + (ok ? "Oui." : "Pas tout à fait.") + " « " + E.esc(it.w.w) + " » : " + E.esc(wordMeaning(it.w)) + ".</b>" + splitHtml(it.w) + "</div>" + E.nextBtn(); }
    return h;
  },
  act: function (a, b, it, q, E) { if (a !== "pickS" || q.done) return; var i = +b.getAttribute("data-i"); q.picked = i; E.finish(it.o[i].ok); E.render(); },
  missed: function (it, E) { return "<span><b>" + E.esc(it.w.w) + "</b></span><span>" + E.esc(wordMeaning(it.w)) + "</span>"; }
});

/* Jeu 5 : fabrique le mot */
registerGame({
  id: "fabrique-mot", name: "Fabrique le mot", desc: "Je construis le mot à partir de son sens.", n: 4, pool: WORDS, help: "vocab",
  prep: function (items) { return items.map(function (w) { return { w: w, m: wordMeaning(w) }; }); },
  reset: function (it, E) {
    var types = it.w.p.map(function (s) { return PM[s].t; });
    var extra = [];
    types.forEach(function (t) {
      var c = E.shuffle(PARTS.filter(function (p) { return p.t === t && it.w.p.indexOf(p.s) < 0 && PM[p.s].m !== PM[it.w.p[types.indexOf(t)]].m && extra.indexOf(p.s) < 0; }))[0];
      if (c && extra.length < 2) extra.push(c.s);
    });
    var all = it.w.p.concat(extra); var pool = E.shuffle(all.map(function (s, i) { return { t: s, id: i }; }));
    return { done: false, built: [], mist: 0, pool: pool };
  },
  view: function (it, q, E) {
    var h = E.head(), full = q.built.length === it.w.p.length;
    h += '<div class="panel"><p class="label">Fabrique le mot qui veut dire</p><p class="task"><b>« ' + E.esc(it.m) + " »</b></p><p class=\"lead\">" + it.w.p.length + " morceaux, dans l’ordre.</p>" + E.listen("Fabrique le mot qui veut dire : " + it.m) + "</div>";
    h += '<div class="build' + (full ? " full" : "") + '">';
    q.built.forEach(function (pid) { var s = q.pool.filter(function (p) { return p.id === pid; })[0].t; h += '<span class="pc big ' + PM[s].t + '">' + E.esc(s) + "</span>"; });
    h += "</div>";
    if (!full) {
      h += '<div class="pool">';
      q.pool.forEach(function (p) { h += '<button data-act="pickM" data-id="' + p.id + '"' + (q.built.indexOf(p.id) > -1 ? " disabled" : "") + ">" + E.esc(p.t) + "</button>"; });
      h += '</div><p class="msg" id="msg">Commence par le début du mot.</p>';
    } else {
      h += '<div class="fb"><b>' + (q.mist === 0 ? "Mot réussi du premier coup : " : "Mot complet : ") + E.esc(it.w.w) + "</b>" + splitHtml(it.w) + "</div>" + E.nextBtn();
    }
    return h;
  },
  act: function (a, b, it, q, E) {
    if (a !== "pickM" || q.done) return;
    var id = +b.getAttribute("data-id"), s = q.pool.filter(function (p) { return p.id === id; })[0].t;
    if (s === it.w.p[q.built.length]) {
      q.built.push(id);
      if (q.built.length === it.w.p.length) E.finish(q.mist === 0);
      E.render();
    } else {
      q.mist++; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      var m = document.getElementById("msg"); if (m) m.textContent = q.built.length === 0 ? "Pas celui-là. Quel morceau vient en premier ?" : "Pas celui-là. Cherche le morceau suivant.";
    }
  },
  missed: function (it, E) { return "<span>« " + E.esc(it.m) + " »</span><span><b>" + E.esc(it.w.w) + "</b></span>"; }
});

/* Jeu 6 : le bon morceau */
registerGame({
  id: "bon-morceau", name: "Le bon morceau", desc: "Je trouve le sens d’un préfixe, d’une racine ou d’un suffixe.", n: 6, help: "vocab",
  pool: (function () { var l = []; WORDS.forEach(function (w) { w.p.forEach(function (s, i) { l.push({ w: w, i: i }); }); }); return l; })(),
  prep: function (items) {
    return items.map(function (it) {
      var s = it.w.p[it.i], part = PM[s], c = [{ t: part.m, ok: true }], used = {}; used[part.m] = 1;
      shuffle(PARTS.filter(function (p) { return p.t === part.t && !used[p.m]; })).forEach(function (p) { if (c.length < 3 && !used[p.m]) { used[p.m] = 1; c.push({ t: p.m, ok: false }); } });
      return { w: it.w, s: s, part: part, o: shuffle(c) };
    });
  },
  reset: function () { return { done: false, picked: null }; },
  view: function (it, q, E) {
    var h = E.head(), speak = "Dans " + it.w.w + ", que veut dire " + it.s + " ?";
    it.o.forEach(function (o, i) { speak += " Réponse " + (i + 1) + " : " + o.t; });
    var word = '<span class="wordline">' + it.w.p.map(function (x) { return '<span class="pc ' + (x === it.s ? PM[x].t : "plain") + '">' + E.esc(x) + "</span>"; }).join("") + "</span>";
    h += '<div class="panel center"><p class="label">Dans le mot</p><p class="bigword">' + word + '</p><p class="task">Que veut dire « <b>' + E.esc(it.s) + "</b> » ?</p>" + E.listen(speak) + "</div><div class=\"stack\">";
    it.o.forEach(function (o, i) {
      var cls = "opt"; if (q.done) { if (o.ok) cls += " right"; else if (i === q.picked) cls += " wrong"; }
      h += '<button class="' + cls + '" data-act="pickP" data-i="' + i + '"' + (q.done ? " disabled" : "") + ">" + E.esc(o.t) + "</button>";
    });
    h += "</div>";
    if (q.done) { var ok = it.o[q.picked].ok; h += '<div class="fb' + (ok ? "" : " no") + '"><b>' + (ok ? "Oui." : "Pas tout à fait.") + " « " + E.esc(it.s) + " » est un " + TYPE[it.part.t] + " : " + E.esc(it.part.m) + ".</b>" + splitHtml(it.w) + "</div>" + E.nextBtn(); }
    return h;
  },
  act: function (a, b, it, q, E) { if (a !== "pickP" || q.done) return; var i = +b.getAttribute("data-i"); q.picked = i; E.finish(it.o[i].ok); E.render(); },
  missed: function (it, E) { return "<span><b>" + E.esc(it.s) + "</b> (dans " + E.esc(it.w.w) + ")</span><span>" + E.esc(it.part.m) + "</span>"; }
});
